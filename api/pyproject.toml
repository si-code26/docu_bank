[project]
name="docubank-api"
version="0.1.0"
description="DocuBank API service"
requires-python=">=3.12"

dependencies=[
    "fastapi>0.115",
    "uvicorn[standard]>=0.30"
]

[dependency-groups]
dev=[
    "pytest>=8.0",
    "ruff>0.6"
]

[tool.ruff.lint]
select = ["E","F","I","UP","B"]

[tool.pytest.ini_options]
testpaths=["tests"]

