[project]
name="docubank-api"
version="0.1.0"
description="DocuBank API service"
requires-python=">=3.12"

dependencies=[
    "asyncpg>=0.29",
    "boto3>=1.34",
    "fastapi>0.115",
    "openai>=1.40",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "tiktoken>=0.7",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev=[
    "pytest>=8.0",
    "ruff>0.6"
]

[tool.ruff]
line-length=100

[tool.ruff.lint]
select = ["E","F","I","UP","B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls=["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths=["tests"]

