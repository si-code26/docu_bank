services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docubank
      POSTGRES_PASSWORD: docubank
      POSTGRES_DB: docubank
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docubank"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379

  localstack:
    image: localstack/localstack:4
    environment:
      - SERVICES=s3,sqs
    ports:
      - 4566:4566
    volumes:
      - ./scripts/localstack-init:/etc/localstack/init/ready.d

volumes:
  pgdata:

