[project]
name="docubank-worker"
version="0.1.0"
description="Docubank ingest worker"
requires-python=">=3.12"

dependencies=[
    "asyncpg>=0.29",
    "boto3>=1.34",
    "openai>=1.40",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "tiktoken>=0.7",
]

[dependency-groups]
dev=[
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.ruff]
line-length=100

[tool.ruff.lint]
select=["E","F","I","UP","B"]

[tool.pytest.ini_options]
testpaths=["tests"]
