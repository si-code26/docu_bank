[project]
name="docubank-worker"
version="0.1.0"
description="Docubank ingest worker"
requires-python=">=3.12"

dependencies=[
    "boto3>=1.34",
    "pymupdf>=1.24"
]

[dependency-groups]
dev=[
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.ruff]
line-length=100

[tool.ruff.lint]
select=["E","F","I","UP","B"]

[tool.pytest.ini_options]
testpaths=["tests"]